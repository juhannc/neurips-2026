<div id="app">

    <div class="dock-tabs" id="dockTabs">
      <button type="button" data-tab="today" class="active" aria-label="Home" aria-current="page"><span class="tabicon"><svg class="dock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg></span><span class="dock-tab-label">Home</span></button>
