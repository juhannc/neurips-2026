name: Publish NeurIPS Guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static PWA
        run: |
          node --check app.js
          node --check sw.js
          node tests/calendar.test.cjs
          node -e "const g=require('./guide.json'); if(!g.events?.length||!g.posters?.length||!g.booths?.length) process.exit(1)"
          test "$(cat CNAME)" = "neurips-2026.chrstnsn.de"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
